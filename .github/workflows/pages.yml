name: Refresh data and deploy site

on:
  schedule:
    - cron: "17 9 * * 1"      # every Monday 09:17 UTC
  workflow_dispatch:           # "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Pull fresh data from YouTube and build the site
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          python scb_library.py --workbook public_library.xlsx --no-backup
          python build_site.py --workbook public_library.xlsx --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
